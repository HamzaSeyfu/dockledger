[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockledger"
version = "0.1.0"
description = "Ring-powered warehouse detention evidence and invoice reconciliation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Hamza Zebirate"}]
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "requests>=2.32,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
